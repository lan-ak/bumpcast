name: BumpCast
options:
  bundleIdPrefix: ca.akinyemi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2Q87Z7RM4V
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.18.0
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  BumpCast:
    type: application
    platform: iOS
    sources:
      - BumpCast
      - Shared
    dependencies:
      - package: Supabase
      - package: SuperwallKit
      - target: BumpCastWidgets
        embed: true
    entitlements:
      path: BumpCast/BumpCast.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.akinyemi.bumpcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 8
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BumpCast
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_FILE: BumpCast/Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BumpCast AppStore
          CODE_SIGN_ENTITLEMENTS: BumpCast/BumpCast.Release.entitlements
  BumpCastWidgets:
    type: app-extension
    platform: iOS
    sources:
      - BumpCastWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.akinyemi.bumpcast.widgets
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 8
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BumpCast
        INFOPLIST_FILE: BumpCastWidgets/Info.plist
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BumpCast Widgets AppStore
  BumpCastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BumpCastTests
    dependencies:
      - target: BumpCast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
schemes:
  BumpCast:
    build:
      targets:
        BumpCast: all
        BumpCastTests: [test]
    run:
      storeKitConfiguration: BumpCast/Products.storekit
    test:
      targets:
        - BumpCastTests
